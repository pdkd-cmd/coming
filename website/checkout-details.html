<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        .container {

            max-width: 900px;

            margin: 40px auto;

            padding: 20px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

        }

        button {

            margin-top: 20px;

            padding: 15px 35px;

            background: #111;

            color: #fff;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 17px;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Checkout</h1>

        <div class="form-group">

            <label>Name</label>

            <input type="text" id="customerName">

        </div>

        <div class="form-group">

            <label>Mobile</label>

            <input type="text" id="customerPhone">

        </div>

        <div class="form-group">

            <label>Address</label>

            <textarea id="customerAddress"></textarea>

        </div>

        <button onclick="placeOrder()">

            Proceed To Telegram

        </button>

    </div>

    <script src="assets/js/checkout.js"></script>

</body>

</html>
