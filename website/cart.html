<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/product.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .cart-container {

            max-width: 1200px;

            margin: 40px auto;

            padding: 20px;

        }

        .cart-title {

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 30px;

        }

        .cart-item {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 20px;

            margin-bottom: 20px;

            background: #fff;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        .cart-item img {

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 10px;

        }

        .cart-info {

            flex: 1;

        }

        .cart-info h3 {

            margin-bottom: 10px;

        }

        .empty-cart {

            text-align: center;

            padding: 100px 20px;

        }

        .empty-cart button {

            margin-top: 20px;

            padding: 15px 30px;

            background: #111;

            color: #fff;

            border: none;

            border-radius: 8px;

            cursor: pointer;

        }

        .qty {

            width: 70px;

            padding: 8px;

        }

        .qty-box {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 10px;

        }

        .qty-box button {

            width: 35px;

            height: 35px;

            border: none;

            background: #111;

            color: #fff;

            border-radius: 8px;

            cursor: pointer;

            font-size: 18px;

        }

        .qty-box input {

            width: 55px;

            text-align: center;

            padding: 8px;

            border: 1px solid #ddd;

            border-radius: 8px;

        }

        .remove-btn {

            margin-top: 12px;

            background: #ff3b30;

            color: #fff;

            padding: 10px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

        }

        .remove {

            background: red;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

        }

        .checkout {

            margin-top: 30px;

            text-align: right;

        }

        .checkout h2 {

            margin-bottom: 20px;

        }

        .checkout button {

            padding: 12px 30px;

            margin-left: 10px;

            background: #111;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

        }
    </style>

</head>

<body>

    <header class="header">

        <div class="top-header">

            <div class="logo">

                <a href="index.html">

                    <img src="assets/images/logo.png">

                </a>

            </div>

        </div>

    </header>

    <div class="cart-container">

        <h1 class="cart-title">

            🛒 Shopping Cart

        </h1>

        <div id="cartItems"></div>

        <div class="checkout">

            <h2>

                Total :

                <span id="cartTotal">

                    ₹0

                </span>

            </h2>

            <button onclick="clearCart()">

                Clear Cart

            </button>

            <a href="checkout.html">

                <button>

                    Checkout

                </button>

            </a>

        </div>

    </div>

    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>

</html>
