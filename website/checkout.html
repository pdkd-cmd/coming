<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Checkout</h1>

        <div class="form-group">

            <label>Customer Name</label>

            <input type="text" id="customerName" placeholder="Enter your name">

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input type="text" id="customerPhone" placeholder="Enter phone number">

        </div>

        <div class="form-group">

            <label>Delivery Address</label>

            <textarea id="customerAddress" placeholder="Enter full address"></textarea>

        </div>

        <button class="checkout-btn" onclick="placeOrder()">
        
            Place Order
        
        </button>

    </div>

    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/checkout.js"></script>

</body>

</html>
