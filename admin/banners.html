<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Banner Manager</title>

    <link rel="stylesheet" href="assets/css/admin.css">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #search {
            width: 300px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #111;
            color: white;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        th {
            background: #111;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .banner-img {
            width: 160px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>PDKD Admin</h2>

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="offers.html">Offers</a></li>
                <li><a href="banners.html">Banners</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>

            </ul>

        </aside>

        <main class="main-content">

            <div class="container">

                <div class="top-bar">

                    <h1>Banner Manager</h1>

                    <button onclick="location.href='add-banner.html'">

                        + Add Banner

                    </button>

                </div>

                <input id="search" placeholder="Search Banner">

                <br><br>

                <table>

                    <thead>

                        <tr>

                            <th>Image</th>

                            <th>Title</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="bannerTable">

                    </tbody>

                </table>

            </div>

    </div>

    </main>

    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/banners.js"></script>

</body>

</html>
