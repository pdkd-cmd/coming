<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders</title>

    <link rel="stylesheet" href="assets/css/admin.css">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        #searchOrder {

            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 25px;

        }

        table {

            width: 100%;
            background: #fff;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);

        }

        th {

            background: #111;
            color: #fff;
            padding: 15px;

        }

        td {

            padding: 15px;
            border-bottom: 1px solid #eee;

        }

        select {

            padding: 8px;
            border-radius: 8px;

        }

        button {

            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

        }

        .view {

            background: #111;
            color: #fff;

        }

        .delete {

            background: #dc3545;
            color: #fff;

        }

        #viewModal {

            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);

        }

        .modal {

            background: #fff;
            width: 850px;
            max-width: 95%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            max-height: 85vh;
            overflow: auto;

        }
    </style>

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>PDKD Admin</h2>

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="offers.html">Offers</a></li>
                <li><a href="banners.html">Banners</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>

            </ul>

        </aside>

        <main class="main-content">

            <div class="container">

                    <h1>Orders</h1>

                    <input id="searchOrder" placeholder="Search Order">

                    <table>

                        <thead>

                            <tr>

                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Phone</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="ordersTable">

                        </tbody>

                    </table>

                </div>

                <div id="viewModal">

                    <div class="modal">

                        <div id="modalBody">

                        </div>

                        <br>

                        <button onclick="closeModal()" class="view">

                            Close

                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/orders.js"></script>
    <script src="assets/js/sidebar.js"></script>

</body>

</html>
