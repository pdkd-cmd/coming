<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory</title>

    <link rel="stylesheet" href="assets/css/admin.css">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        #search {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            background: #fff;
            border-collapse: collapse;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        th {
            background: #111;
            color: #fff;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .stock-good {
            color: green;
            font-weight: bold;
        }

        .stock-low {
            color: orange;
            font-weight: bold;
        }

        .stock-out {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 8px 15px;
            border: none;
            background: #111;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type=number] {
            width: 80px;
            padding: 8px;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>PDKD Admin</h2>

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="offers.html">Offers</a></li>
                <li><a href="banners.html">Banners</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>

            </ul>

        </aside>

        <main class="main-content">

            <div class="container">

                <h1>Inventory</h1>

                <input id="search" placeholder="Search Product">

                <table>

                    <thead>

                        <tr>

                            <th>Image</th>
                            <th>SKU</th>
                            <th>Name</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="inventoryTable">

                    </tbody>

                </table>

            </div>



    </div>

    </main>

    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/inventory.js"></script>
    <script src="assets/js/sidebar.js"></script>

</body>

</html>
