# Copy to /etc/cloudflared/config.yml after creating a Cloudflare Tunnel.
# Replace placeholders; do not commit the credentials JSON file.
tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  # Replace with your hostname in Cloudflare.
  - hostname: <YOUR_HOSTNAME>
    service: http://localhost:80
  - service: http_status:404
